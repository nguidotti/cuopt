name: Kitmaker Portal (via Charon Ferry)

on:
  workflow_call:
    inputs:
      mode:
        description: |
          mode: 'smoke-test' polls an existing Kitmaker Portal status ID (no side effects).
          'release' requests a new release for 'release_tag' and polls it to completion.
        required: true
        type: string
      status_id:
        description: "status_id: existing Kitmaker Portal status UUID. Required for mode == 'smoke-test'."
        type: string
      release_tag:
        description: "release_tag: git tag whose GitHub Release assets should be published to Kitmaker. Required for mode == 'release'."
        type: string
      project_name:
        description: "project_name: Kitmaker project name. Must exactly match the wheel/component name. Required for mode == 'release'."
        type: string
      project_id:
        description: "project_id: numeric Kitmaker project ID (from GET /api/v0/projects). Required for mode == 'release'."
        type: string
      wheel_asset_pattern:
        description: |
          wheel_asset_pattern: extended regex (matched with jq's 'test()') selecting this
          project's wheel/sdist asset names out of the GitHub Release, e.g. '^libcuopt-'.
          Required for mode == 'release'.
        type: string
      pic:
        description: "pic: 'person in charge' email required by the Kitmaker release API. Defaults to secrets.KITMAKER_RELEASE_PIC."
        type: string
      upload:
        description: |
          upload: forwarded to the Kitmaker release API. 'false' (default) runs validation
          checks only, with no real publish. Must be explicitly set to 'true' to actually
          publish wheels. Only used for mode == 'release'.
        type: boolean
        default: false
    outputs:
      status_id:
        description: Kitmaker Portal status UUID created by mode == 'release'.
        value: ${{ jobs.release.outputs.status_id }}
  workflow_dispatch:
    inputs:
      mode:
        description: "mode: 'smoke-test' polls an existing status ID. 'release' requests a new release and polls it."
        required: true
        type: choice
        options:
          - smoke-test
          - release
      status_id:
        description: "status_id: existing Kitmaker Portal status UUID. Required for mode == 'smoke-test'."
        type: string
      release_tag:
        description: "release_tag: git tag whose GitHub Release assets should be published to Kitmaker. Required for mode == 'release'."
        type: string
      project_name:
        description: "project_name: Kitmaker project name. Must exactly match the registered project. Required for mode == 'release'."
        type: string
      project_id:
        description: "project_id: numeric Kitmaker project ID (from GET /api/v0/projects). Required for mode == 'release'."
        type: string
      wheel_asset_pattern:
        description: |
          wheel_asset_pattern: extended regex (matched with jq's 'test()') selecting this
          project's wheel/sdist asset names out of the GitHub Release, e.g. '^libcuopt-'.
          Required for mode == 'release'.
        type: string
      pic:
        description: "pic: 'person in charge' email required by the Kitmaker release API. Defaults to secrets.KITMAKER_RELEASE_PIC."
        type: string
      upload:
        description: |
          upload: forwarded to the Kitmaker release API. 'false' (default) runs validation
          checks only, with no real publish. Only used for mode == 'release'.
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  smoke-test:
    if: inputs.mode == 'smoke-test'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install Teleport
        uses: teleport-actions/setup@v1
        with:
          version: auto
          proxy: nv-stg-ps.teleport.sh:443

      - name: Start staging Ferry tunnel
        uses: teleport-actions/application-tunnel@v1
        with:
          proxy: nv-stg-ps.teleport.sh:443
          token: charon-gha-runners
          app: charon
          listen: tcp://127.0.0.1:8888

      - name: Mint Ferry identity token
        id: ferry-token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('charon.nvidia.com');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Poll Kitmaker Portal status
        env:
          FERRY_TOKEN: ${{ steps.ferry-token.outputs.token }}
          # Store just the bare token (e.g. kmp_...); "Bearer " is prepended below.
          PORTAL_AUTHORIZATION: ${{ secrets.KITMAKER_PORTAL_AUTHORIZATION }}
          STATUS_ID: ${{ inputs.status_id }}
        run: |
          if [[ -z "$STATUS_ID" ]]; then
            echo "::error::mode == 'smoke-test' requires 'status_id'"
            exit 1
          fi

          curl --fail-with-body --show-error \
            -H "X-Charon-GHA-Token: $FERRY_TOKEN" \
            -H "Authorization: Bearer $PORTAL_AUTHORIZATION" \
            "http://127.0.0.1:8888/kitmaker-portal/api/v0/status/$STATUS_ID"

  release:
    # Schema (POST /api/v0/projects/{id}/releases, GET /api/v0/status/{uuid}) follows
    # https://kitmaker.gitlab-master-pages.nvidia.com/kitmaker-docs/users/portal-api/wheel-release-api.html
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      status_id: ${{ steps.kitmaker-release.outputs.status_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT_NAME: ${{ inputs.project_name }}
      PROJECT_ID: ${{ inputs.project_id }}
      ASSET_PATTERN: ${{ inputs.wheel_asset_pattern }}
      PIC: ${{ inputs.pic || secrets.KITMAKER_RELEASE_PIC }}
    steps:
      - name: Validate inputs
        run: |
          [[ -n "${{ inputs.release_tag }}" ]] || { echo "::error::mode == 'release' requires 'release_tag'"; exit 1; }
          [[ -n "$PROJECT_NAME" ]] || { echo "::error::mode == 'release' requires 'project_name'"; exit 1; }
          [[ -n "$PROJECT_ID" ]] || { echo "::error::mode == 'release' requires 'project_id'"; exit 1; }
          [[ -n "$ASSET_PATTERN" ]] || { echo "::error::mode == 'release' requires 'wheel_asset_pattern'"; exit 1; }
          [[ -n "$PIC" ]] || { echo "::error::'pic' input or secrets.KITMAKER_RELEASE_PIC must be set"; exit 1; }

      - name: Collect wheel asset URLs from the GitHub Release
        id: assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          urls_json=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json assets \
            --jq "[.assets[] | select(.name | test(\"$ASSET_PATTERN\")) | .url]")

          if [[ "$(echo "$urls_json" | jq 'length')" -eq 0 ]]; then
            echo "::error::No assets on release '$RELEASE_TAG' matched pattern '$ASSET_PATTERN'"
            exit 1
          fi

          echo "upload=$UPLOAD (false = validate only, no real publish; true = publishes for real)"

          payload=$(echo "$urls_json" | jq -c --arg pic "$PIC" --argjson upload "$UPLOAD" '
            map({pic: $pic, job_type: "wheel-release-job", url: ., upload: $upload})
          ')
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Install Teleport
        uses: teleport-actions/setup@v1
        with:
          version: auto
          proxy: nv-stg-ps.teleport.sh:443

      - name: Start staging Ferry tunnel
        uses: teleport-actions/application-tunnel@v1
        with:
          proxy: nv-stg-ps.teleport.sh:443
          token: charon-gha-runners
          app: charon
          listen: tcp://127.0.0.1:8888

      - name: Mint Ferry identity token
        id: ferry-token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('charon.nvidia.com');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Request Kitmaker Portal release
        id: kitmaker-release
        env:
          FERRY_TOKEN: ${{ steps.ferry-token.outputs.token }}
          # Store just the bare token (e.g. kmp_...); "Bearer " is prepended below.
          PORTAL_AUTHORIZATION: ${{ secrets.KITMAKER_PORTAL_AUTHORIZATION }}
          PAYLOAD: ${{ steps.assets.outputs.payload }}
        run: |
          body=$(jq -n --arg project_name "$PROJECT_NAME" --argjson payload "$PAYLOAD" \
            '{project_name: $project_name, payload: $payload}')

          http_response=$(curl -sS -w '\n%{http_code}' \
            -H "X-Charon-GHA-Token: $FERRY_TOKEN" \
            -H "Authorization: Bearer $PORTAL_AUTHORIZATION" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "http://127.0.0.1:8888/kitmaker-portal/api/v0/projects/${PROJECT_ID}/releases")

          http_code=$(echo "$http_response" | tail -n1)
          response=$(echo "$http_response" | sed '$d')

          echo "HTTP $http_code"
          echo "$response"

          if [[ "$http_code" != "202" ]]; then
            exit 1
          fi

          status_id=$(echo "$response" | jq -r '.release_uuid')
          echo "status_id=$status_id" >> "$GITHUB_OUTPUT"

      - name: Poll Kitmaker Portal status
        env:
          FERRY_TOKEN: ${{ steps.ferry-token.outputs.token }}
          PORTAL_AUTHORIZATION: ${{ secrets.KITMAKER_PORTAL_AUTHORIZATION }}
          STATUS_ID: ${{ steps.kitmaker-release.outputs.status_id }}
        run: |
          for _ in $(seq 1 60); do
            http_response=$(curl -sS -w '\n%{http_code}' \
              -H "X-Charon-GHA-Token: $FERRY_TOKEN" \
              -H "Authorization: Bearer $PORTAL_AUTHORIZATION" \
              "http://127.0.0.1:8888/kitmaker-portal/api/v0/status/$STATUS_ID")
            http_code=$(echo "$http_response" | tail -n1)
            response=$(echo "$http_response" | sed '$d')

            if [[ "$http_code" != "200" ]]; then
              echo "HTTP $http_code"
              echo "$response"
              exit 1
            fi

            status=$(echo "$response" | jq -r '.status')
            echo "Kitmaker Portal release status: $status"
            case "$status" in
              completed)
                exit 0
                ;;
              failed)
                echo "$response"
                exit 1
                ;;
              pending|in_progress) ;;
              *)
                echo "::error::Unexpected status '$status'"
                echo "$response"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for Kitmaker Portal release to complete"
          exit 1
